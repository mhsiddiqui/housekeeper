# Dependency policy, checked in CI with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory: vulnerable, unmaintained or yanked crates.
yanked = "deny"

[licenses]
# Dependencies: permissive licences, all compatible with distributing Housekeeper under GPL-3.0-or-later.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# Housekeeper's own crates (GPL-3.0-or-later, publish = false) are not dependencies; only third-party crates are checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published to crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
