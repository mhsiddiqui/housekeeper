name: CI

# Only for `main`: pull requests into it and what lands on it. Pull requests into other branches run nothing, so every
# pull request should target `main` (see CONTRIBUTING.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Sources are declared by build.rs through include!, which cargo fmt does not follow.
      - run: rustfmt --check crates/linux/src/sources/*.rs
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  # The oldest Rust the workspace promises to build with (`rust-version` in Cargo.toml).
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps --locked

  # Security advisories, licences and dependency sources (deny.toml).
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  packages:
    uses: ./.github/workflows/packages.yml

  # The one check branch protection requires: green only when every job above (and every package/distro job inside
  # `packages`) succeeded. Failed, cancelled or skipped jobs make it red, so the ruleset never needs the matrix names.
  ci-ok:
    if: always()
    needs: [lint, test, msrv, docs, dependencies, packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job ended with: $result"; exit 1; }
          done
