# Publishing a GitHub release tagged vX.Y.Z builds the packages, tests them on every supported distribution and
# attaches them to the release. See docs/RELEASING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml

  upload:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir upload
          find artifacts -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          cat artifacts/*/SHA256SUMS | sort -k2 > upload/SHA256SUMS
          ls -l upload
          gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
