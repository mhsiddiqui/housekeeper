[workspace]
resolver = "3"
# Operating-system crates live inside the platform crate that picks between them (`crates/platform/<os>`).
members = ["crates/*", "crates/platform/linux"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mhsiddiqui/housekeeper"
authors = ["Muhammad Hassan Siddiqi"]
publish = false

[workspace.dependencies]
housekeeper-core = { path = "crates/core" }
housekeeper-linux = { path = "crates/platform/linux" }
housekeeper-platform = { path = "crates/platform" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
